name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version to release, without the v prefix (example: 1.1.1)'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes'
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer without the v prefix. Received: $version"
          }
          $existingTag = git tag --list "v$version"
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Tag v$version already exists."
          }

      - name: Install dependencies
        run: npm ci

      - name: Update package version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Commit and tag release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$env:RELEASE_VERSION"
          git tag "v$env:RELEASE_VERSION"
          git push origin main
          git push origin "v$env:RELEASE_VERSION"

      - name: Build production (Vite + TypeScript)
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $notes = $env:RELEASE_NOTES
          $notesFile = New-TemporaryFile
          if ([string]::IsNullOrWhiteSpace($notes)) {
            "Release v$version" | Set-Content -Encoding UTF8 $notesFile
          } else {
            $notes | Set-Content -Encoding UTF8 $notesFile
          }
          gh release create "v$version" `
            --repo "${{ github.repository }}" `
            --title "v$version" `
            --notes-file $notesFile `
            "build-release/pdv-facil-setup-$version.exe" `
            "build-release/pdv-facil-setup-$version.exe.blockmap" `
            "build-release/latest.yml"
