name: Build & Release

on:
  push:
    branches: [main]

# Garante que apenas um build rode por vez, cancelando o anterior se houver push rápido
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write  # Necessário para criar releases e fazer upload de assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production (Vite + TypeScript)
        run: npm run build

      - name: Package & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
